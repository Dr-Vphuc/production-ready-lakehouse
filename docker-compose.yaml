# Basic Airflow cluster configuration for CeleryExecutor with Redis and PostgreSQL.
#
# WARNING: This configuration is for local development. Do not use it in a production deployment.
#
# This configuration supports basic configuration using environment variables or an .env file
# The following variables are supported:
#
# AIRFLOW_IMAGE_NAME           - Docker image name used to run Airflow.
#                                Default: apache/airflow:3.3.2
# AIRFLOW_UID                  - User ID in Airflow containers
#                                Default: 50000
# AIRFLOW_PROJ_DIR             - Base path to which all the files will be volumed.
#                                Default: .
# Those configurations are useful mostly in case of standalone testing/running Airflow in test/try-out mode
#
# _AIRFLOW_WWW_USER_USERNAME   - Username for the administrator account (if requested).
#                                Default: airflow
# _AIRFLOW_WWW_USER_PASSWORD   - Password for the administrator account (if requested).
#                                Default: airflow
# _PIP_ADDITIONAL_REQUIREMENTS - Additional PIP requirements to add when starting all containers.
#                                Use this option ONLY for quick checks. Installing requirements at container
#                                startup is done EVERY TIME the service is started.
#                                A better way is to build a custom image or extend the official image
#                                as described in https://airflow.apache.org/docs/docker-stack/build.html.
#                                Default: ''
#
# Feel free to modify this file to suit your needs.
---
x-airflow-common:
  &airflow-common
  # In order to add custom dependencies or upgrade provider distributions you can use your extended image.
  # Comment the image line, place your Dockerfile in the directory where you placed the docker-compose.yaml
  # and uncomment the "build" line below, Then run `docker-compose build` to build the images.
  image: my-airflow-image:latest
  build: .
  env_file:
    - ${ENV_FILE_PATH:-.env}
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-airflow_jwt_secret}
    AIRFLOW__API_AUTH__JWT_ISSUER: ${AIRFLOW__API_AUTH__JWT_ISSUER:-airflow}
    # yamllint disable rule:line-length
    # Use simple http server on scheduler for health checks
    # See https://airflow.apache.org/docs/apache-airflow/stable/administration-and-deployment/logging-monitoring/check-health.html#scheduler-health-check-server
    # yamllint enable rule:line-length
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # WARNING: Use _PIP_ADDITIONAL_REQUIREMENTS option ONLY for a quick checks
    # for other purpose (development, test and especially production usage) build/extend Airflow image.
    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-}
    # The following line can be used to set a custom config file, stored in the local config folder
    AIRFLOW_CONFIG: '/opt/airflow/config/airflow.cfg'
  volumes:
    - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-.}/config:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR:-.}/plugins:/opt/airflow/plugins
    - ${AIRFLOW_PROJ_DIR:-.}/dbt:/opt/airflow/dbt
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy

x-spark-common:
  &spark-common
  image: my-spark-image:latest
  build: 
    context: ./spark
    target: runtime
  restart: always
  environment:
    AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    AWS_REGION: us-east-1
  volumes:
    - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    - ./archive:/data/archive:ro

x-superset-common:
  &superset-common
  image: my-superset:latest
  build: ./superset
  environment:
    &superset-common-env
    # Khóa ký session và mã hóa mật khẩu kết nối DB lưu trong Superset
    SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
  volumes:
    # Metadata của Superset (user, kết nối, dataset, chart, dashboard) nằm trong SQLite ở thư mục này
    - superset-home:/app/superset_home


services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  redis:
    # Redis is limited to 7.2-bookworm due to licencing change
    # https://redis.io/blog/redis-adopts-dual-source-available-licensing/
    image: redis:7.2-bookworm
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    restart: always

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: *airflow-common
    command: celery worker
    volumes:
      - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags
      - ${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow/logs
      - ${AIRFLOW_PROJ_DIR:-.}/config:/opt/airflow/config
      - ${AIRFLOW_PROJ_DIR:-.}/plugins:/opt/airflow/plugins
      - ${AIRFLOW_PROJ_DIR:-.}/dbt:/opt/airflow/dbt
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      # yamllint disable rule:line-length
      test: ["CMD-SHELL", 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      <<: *airflow-common-env
      # Required to handle warm shutdown of the celery workers properly
      # See https://airflow.apache.org/docs/docker-stack/entrypoint.html#signal-propagation
      DUMB_INIT_SETSID: "0"
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-apiserver:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    # yamllint disable rule:line-length
    command:
      - -c
      - |
        if [[ -z "${AIRFLOW_UID}" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: AIRFLOW_UID not set!\e[0m"
          echo "If you are on Linux, you SHOULD follow the instructions below to set "
          echo "AIRFLOW_UID environment variable, otherwise files will be owned by root."
          echo "For other operating systems you can get rid of the warning with manually created .env file:"
          echo "    See: https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#setting-the-right-airflow-user"
          echo
          export AIRFLOW_UID=$$(id -u)
        fi
        one_meg=1048576
        mem_available=$$(($$(getconf _PHYS_PAGES) * $$(getconf PAGE_SIZE) / one_meg))
        cpus_available=$$(grep -cE 'cpu[0-9]+' /proc/stat)
        disk_available=$$(df / | tail -1 | awk '{print $$4}')
        warning_resources="false"
        if (( mem_available < 4000 )) ; then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough memory available for Docker.\e[0m"
          echo "At least 4GB of memory required. You have $$(numfmt --to iec $$((mem_available * one_meg)))"
          echo
          warning_resources="true"
        fi
        if (( cpus_available < 2 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough CPUS available for Docker.\e[0m"
          echo "At least 2 CPUs recommended. You have $${cpus_available}"
          echo
          warning_resources="true"
        fi
        if (( disk_available < one_meg * 10 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough Disk space available for Docker.\e[0m"
          echo "At least 10 GBs recommended. You have $$(numfmt --to iec $$((disk_available * 1024 )))"
          echo
          warning_resources="true"
        fi
        if [[ $${warning_resources} == "true" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: You have not enough resources to run Airflow (see above)!\e[0m"
          echo "Please follow the instructions to increase amount of resources available:"
          echo "   https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#before-you-begin"
          echo
        fi
        echo
        echo "Creating missing opt dirs if missing:"
        echo
        mkdir -v -p /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Airflow version:"
        /entrypoint airflow version
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Running airflow config list to create default config file if missing."
        echo
        /entrypoint airflow config list >/dev/null
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Change ownership of files in /opt/airflow to ${AIRFLOW_UID:-50000}:0"
        echo
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/
        echo
        echo "Change ownership of files in shared volumes to ${AIRFLOW_UID:-50000}:0"
        echo
        chown -v -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Creating Airflow pools:"
        echo
        /entrypoint airflow pools set dbt 1 "Moi luc chi mot lenh dbt chay (dung chung spark-thrift va cac bang gold)"

    # yamllint enable rule:line-length
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
      _PIP_ADDITIONAL_REQUIREMENTS: ''
    user: "0:0"

  airflow-cli:
    <<: *airflow-common
    profiles:
      - debug
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"
    # Workaround for entrypoint issue. See: https://github.com/apache/airflow/issues/16252
    command:
      - bash
      - -c
      - airflow
    depends_on:
      <<: *airflow-common-depends-on

    # ---------- MinIO: tầng lưu trữ (S3) ----------
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # Chạy một lần để tạo bucket rồi thoát (giống airflow-init)
  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z   # image này có sẵn lệnh mc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mc alias set lake http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing lake/lakehouse
    restart: "no"

  # ---------- Postgres riêng cho Nessie ----------
  nessie-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${NESSIE_DB_USER}
      POSTGRES_PASSWORD: ${NESSIE_DB_PASSWORD}
      POSTGRES_DB: nessie
    volumes:
      - nessie-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${NESSIE_DB_USER}", "-d", "nessie"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  # ---------- Nessie: Iceberg catalog ----------
  nessie:
    image: ghcr.io/projectnessie/nessie:0.108.8
    depends_on:
      nessie-db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "19120:19120"   # API + Web UI
    environment:
      # (1) Version store: lưu commit/con trỏ vào Postgres thay vì RAM
      nessie.version.store.type: JDBC2
      nessie.version.store.persist.jdbc.datasource: postgresql
      quarkus.datasource.postgresql.jdbc.url: jdbc:postgresql://nessie-db:5432/nessie
      quarkus.datasource.postgresql.username: ${NESSIE_DB_USER}
      quarkus.datasource.postgresql.password: ${NESSIE_DB_PASSWORD}
      # (2) Warehouse: bảng Iceberg mới được đặt dưới s3://lakehouse/
      nessie.catalog.default-warehouse: lakehouse
      nessie.catalog.warehouses.lakehouse.location: s3://lakehouse/
      # (3) Cách Nessie kết nối tới MinIO
      nessie.catalog.service.s3.default-options.endpoint: http://minio:9000/
      nessie.catalog.service.s3.default-options.path-style-access: "true"
      nessie.catalog.service.s3.default-options.region: us-east-1
      nessie.catalog.service.s3.default-options.access-key: urn:nessie-secret:quarkus:nessie.catalog.secrets.access-key
      nessie.catalog.secrets.access-key.name: ${MINIO_ROOT_USER}
      nessie.catalog.secrets.access-key.secret: ${MINIO_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /q/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: always

  # ---------- Spark standalone cluster ----------
  spark-master:
    <<: *spark-common
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
      --host spark-master --port 7077 --webui-port 8080
    ports:
      - "8081:8080"   # Master UI (8080 trên máy đã bị Airflow dùng)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  spark-worker:
    <<: *spark-common
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
      --cores 2 --memory 1g --webui-port 8081
    deploy:
      replicas: 2
    ports:
      - "8082-8083:8081"   # Worker UI
    depends_on:
      spark-master:
        condition: service_healthy

  spark-thrift:
    <<: *spark-common
    command: >
      /opt/spark/bin/spark-submit
      --class org.apache.spark.sql.hive.thriftserver.HiveThriftServer2
      --name spark-thrift
      --master spark://spark-master:7077
      --conf spark.executor.cores=2
      --conf spark.cores.max=2
    ports:
      - "10000:10000"   # JDBC/Thrift: dbt, beeline, DBeaver kết nối vào đây
      - "4040:4040"     # Spark UI của chính thrift server (driver)
    depends_on:
      spark-master:
        condition: service_healthy
      nessie:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/10000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  spark-ingest:
    <<: *spark-common
    image: my-spark-jobs:latest
    build:
      context: ./spark
      target: jobs
    restart: "no"
    profiles: ["jobs"]
    entrypoint: >
      /opt/spark/bin/spark-submit
      --class lakehouse.IngestEvents
      --name ingest-events
      --master spark://spark-master:7077
      --conf spark.executor.cores=2
      --conf spark.cores.max=2
      /opt/spark/apps/lakehouse-jobs.jar
    depends_on:
      spark-master:
        condition: service_healthy
      nessie:
        condition: service_healthy

  # ---------- Realtime: Kafka (1 node KRaft, không cần ZooKeeper) ----------
  kafka:
    image: apache/kafka:4.3.1
    profiles: ["realtime"]
    environment:
      CLUSTER_ID: 5kwX_TvZSrKCP72vjKLSyQ
      # Node này vừa là broker (nhận/trả tin) vừa là controller (quản lý metadata)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Chỉ có 1 broker nên các topic nội bộ chỉ giữ được 1 bản sao
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9092"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # Chạy một lần để tạo topic rồi thoát (giống minio-init)
  kafka-init:
    image: apache/kafka:4.3.1
    profiles: ["realtime"]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -c
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists --topic ecommerce.events \
          --partitions 3 --replication-factor 1 \
          --config retention.ms=604800000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --describe --topic ecommerce.events
    restart: "no"

  # Giả lập app thương mại điện tử: phát lại một file CSV vào Kafka theo nhịp event_time.
  # Chạy tay: docker compose run --rm event-producer [--month 2020-Feb --speed 288 ...]
  event-producer:
    image: my-event-producer:latest
    build: ./producer
    profiles: ["jobs"]
    command: ["--month", "2020-Feb", "--speed", "288"]
    volumes:
      - ./archive:/data/archive:ro
    restart: "no"

  # Job Structured Streaming: Kafka -> bronze.events, chạy liên tục.
  # Chạy ở chế độ local[2] trong container này, không xin core của Spark cluster.
  spark-streaming:
    <<: *spark-common
    image: my-spark-jobs:latest
    build:
      context: ./spark
      target: jobs
    profiles: ["realtime"]
    restart: unless-stopped
    entrypoint: >
      /opt/spark/bin/spark-submit
      --class lakehouse.StreamEvents
      --name stream-events
      --master local[2]
      --driver-memory 1g
      /opt/spark/apps/lakehouse-jobs.jar
    volumes:
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - spark-checkpoints:/opt/spark/checkpoints
    ports:
      - "4041:4040"   # Spark UI của job streaming (4040 đã dùng cho spark-thrift)
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      nessie:
        condition: service_healthy

  # ---------- BI: ClickHouse đọc thẳng Iceberg (không chép dữ liệu) ----------
  # ClickHouse đóng vai engine truy vấn cho BI (vai Trino trong sơ đồ gốc):
  # hỏi Nessie xem bảng nằm ở file nào rồi tự đọc file Parquet từ MinIO.
  # Nhờ vậy Superset không phải xếp hàng chung Spark Thrift với dbt.
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.15.10
    environment:
      # Entrypoint của image xóa user `default` và tạo user quản trị này
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      # Cho admin quyền quản lý user/quyền bằng SQL (CREATE USER, GRANT) để clickhouse-init dùng
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      # HTTP: Superset kết nối qua cổng này; mở http://localhost:8123/play để chạy SQL bằng trình duyệt.
      # Cổng native 9000 không mở ra máy host vì trùng cổng S3 của MinIO.
      - "8123:8123"
    volumes:
      # Lưu user, quyền, khai báo database (và bảng riêng của ClickHouse nếu sau này cần)
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    # ClickHouse tự giới hạn RAM ở khoảng 90% con số này
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: always

  # Chạy một lần (giống minio-init): khai báo catalog Nessie và tạo user chỉ đọc cho Superset.
  clickhouse-init:
    image: clickhouse/clickhouse-server:26.8.15.10
    depends_on:
      clickhouse:
        condition: service_healthy
      nessie:
        condition: service_healthy
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_SUPERSET_PASSWORD: ${CLICKHOUSE_SUPERSET_PASSWORD}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        clickhouse-client --host clickhouse --user admin --password "$$CLICKHOUSE_PASSWORD" --multiquery <<SQL
        -- Database engine DataLakeCatalog còn ở mức beta nên phải bật cờ này khi CREATE.
        -- Server khởi động lại vẫn nạp database này bình thường, không cần bật lại.
        SET allow_database_iceberg = 1;

        -- Mỗi bảng trong catalog Nessie hiện thành một bảng của database lakehouse,
        -- tên giữ cả namespace nên phải để trong backtick: lakehouse.\`gold.daily_kpis\`.
        --   warehouse        : tên warehouse khai báo ở service nessie
        --   storage_endpoint : MinIO + bucket chứa file của warehouse đó
        --   vended_credentials = 0 : đừng lấy khóa S3 từ catalog. Nessie chỉ trả về cấu hình
        --                      "remote signing" (không kèm khóa); nếu để mặc định, ClickHouse coi đó là
        --                      khóa của catalog, bỏ qua aws_* bên dưới rồi báo lỗi ACCESS_DENIED.
        --   aws_*            : khóa MinIO mà ClickHouse dùng để tự đọc file
        -- IF NOT EXISTS: chạy lại không sao; muốn đổi khóa MinIO thì phải tạo lại database này.
        CREATE DATABASE IF NOT EXISTS lakehouse
        ENGINE = DataLakeCatalog('http://nessie:19120/iceberg')
        SETTINGS catalog_type = 'rest',
                 warehouse = 'lakehouse',
                 storage_endpoint = 'http://minio:9000/lakehouse',
                 vended_credentials = 0,
                 aws_access_key_id = '$$MINIO_ROOT_USER',
                 aws_secret_access_key = '$$MINIO_ROOT_PASSWORD';

        -- User riêng cho Superset, có hai lớp chặn:
        --   chỉ được cấp SELECT, nên không có quyền DROP/ALTER/INSERT;
        --   readonly = 2 chặn mọi lệnh ghi và DDL, chỉ cho đọc và đổi setting của phiên.
        -- Quan trọng vì DROP TABLE trong database lakehouse sẽ xóa luôn bảng thật trong Nessie.
        CREATE USER OR REPLACE superset
        IDENTIFIED BY '$$CLICKHOUSE_SUPERSET_PASSWORD'
        SETTINGS readonly = 2;
        GRANT SELECT ON *.* TO superset;
        SQL
        echo "Các bảng ClickHouse thấy trong catalog Nessie:"
        clickhouse-client --host clickhouse --user admin --password "$$CLICKHOUSE_PASSWORD" \
          --query "SHOW TABLES FROM lakehouse"
    restart: "no"

  # ---------- BI: Superset (dashboard) ----------
  # Chạy một lần (giống airflow-init): tạo/nâng cấp metadata, tạo tài khoản admin,
  # và ở lần đầu thì nạp dashboard dạng code trong superset/bundle/.
  superset-init:
    <<: *superset-common
    depends_on:
      clickhouse-init:
        condition: service_completed_successfully
    environment:
      <<: *superset-common-env
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
      CLICKHOUSE_SUPERSET_PASSWORD: ${CLICKHOUSE_SUPERSET_PASSWORD}
    volumes:
      - superset-home:/app/superset_home
      - ./superset/bundle:/app/bundle:ro
    command:
      - /bin/bash
      - -c
      - |
        set -e
        # Tạo hoặc nâng cấp bảng metadata (SQLite trong volume superset-home)
        superset db upgrade
        # Đã có user này thì lệnh chỉ báo lỗi "already exists" và thoát bình thường
        superset fab create-admin \
          --username "$$SUPERSET_ADMIN_USERNAME" --password "$$SUPERSET_ADMIN_PASSWORD" \
          --firstname Superset --lastname Admin --email admin@example.com
        # Tạo role và quyền mặc định
        superset init

        # Chỉ nạp bundle một lần, để không ghi đè những chỉnh sửa làm sau đó trên giao diện
        MARKER=/app/superset_home/.lakehouse_bundle_imported
        if [ -f "$$MARKER" ]; then
          echo "Bundle đã được nạp trước đó, bỏ qua."
          exit 0
        fi

        # Đóng các file YAML thành zip (thư mục gốc lakehouse/ theo đúng định dạng export của Superset)
        # và thay chỗ giữ chỗ bằng mật khẩu thật lấy từ .env
        python - <<'PY'
        import os
        import pathlib
        import zipfile

        src = pathlib.Path("/app/bundle")
        password = os.environ["CLICKHOUSE_SUPERSET_PASSWORD"]
        with zipfile.ZipFile("/tmp/lakehouse.zip", "w") as bundle:
            for path in sorted(src.rglob("*.yaml")):
                text = path.read_text(encoding="utf-8")
                text = text.replace("__CLICKHOUSE_SUPERSET_PASSWORD__", password)
                bundle.writestr(f"lakehouse/{path.relative_to(src).as_posix()}", text)
        PY
        superset import-dashboards -p /tmp/lakehouse.zip -u "$$SUPERSET_ADMIN_USERNAME"
        rm /tmp/lakehouse.zip
        touch "$$MARKER"
    restart: "no"

  superset:
    <<: *superset-common
    # Dùng lệnh mặc định của image: gunicorn phục vụ web ở cổng 8088 (healthcheck cũng có sẵn trong image)
    ports:
      - "8088:8088"
    depends_on:
      superset-init:
        condition: service_completed_successfully
    restart: always

volumes:
  postgres-db-volume:
  minio-data:
  nessie-db-volume:
  kafka-data:
  spark-checkpoints:
  clickhouse-data:
  superset-home: