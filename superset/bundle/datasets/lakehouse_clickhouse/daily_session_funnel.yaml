- column_name: event_date
  verbose_name: Ngày
  type: Nullable(Date32)
  is_dttm: true
  groupby: true
  filterable: true
- column_name: stage
  verbose_name: Bước
  type: String
  is_dttm: false
  groupby: true
  filterable: true
- column_name: n
  verbose_name: Số phiên
  type: Nullable(Int64)
  is_dttm: false
  groupby: true
  filterable: true
