# Biểu đồ cột realtime: 10 thương hiệu có doanh thu cao nhất trong ngày mới nhất.
# x_axis là cột chữ (brand) thay vì cột thời gian, nên mỗi cột là một thương hiệu.
# Superset sắp theo metric đầu tiên giảm dần (order_desc) rồi lấy row_limit = 10 dòng ngay trong SQL;
# x_axis_sort giữ đúng thứ tự đó khi vẽ. Bỏ các sự kiện không ghi thương hiệu (brand rỗng).
