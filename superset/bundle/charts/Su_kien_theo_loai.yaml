# Biểu đồ đường realtime: số sự kiện mỗi 10 phút trong ngày mới nhất, mỗi loại sự kiện một đường.
# time_grain_sqla = PT10M: ClickHouse gom event_time về đầu khung 10 phút.
# groupby = event_type tách thành nhiều đường (view, cart, remove_from_cart, purchase).
slice_name: Sự kiện theo loại (10 phút)
description: COUNT(*) theo khung 10 phút của event_time và theo event_type, ngày mới nhất của rt.events.
viz_type: echarts_timeseries_line
