uuid: 8eb6a163-1e9c-4b02-b53d-1c11fb9543fc
version: 1.0.0
cache_timeout: null
certified_by: null
certification_details: null
query_context: null
params:
  viz_type: echarts_timeseries_line
  x_axis: event_time
  time_grain_sqla: PT10M
  metrics:
  - events
  groupby:
  - event_type
  adhoc_filters:
