# Dashboard realtime: đọc rt.events (Kafka -> ClickHouse, trễ vài giây), không qua Spark/dbt.
# Mọi chart chỉ xét "hôm nay" theo đồng hồ phát lại (ngày của sự kiện mới nhất đã nhận).
# Bố cục lưới 12 cột:
#   dòng 1: 4 Big Number (mỗi ô rộng 3)
#   dòng 2: sự kiện theo loại + doanh thu lũy kế (mỗi ô rộng 6)
#   dòng 3: top thương hiệu + trạng thái luồng (mỗi ô rộng 6)
